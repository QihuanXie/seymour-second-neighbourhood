name: Lean build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
      - name: Proof-term traversal (no linear algebra)
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean scripts/DepCheck.lean
